# Video queue for Kwento: Kilabot. Each run takes the FIRST topic with status: ready.
#
# status values:
#   draft             - not ready yet, skipped
#   ready             - will be produced on the next run
#   in_progress       - a run picked it up (set automatically)
#   prompts_only      - script + prompts written, Flow generation not done (e.g. computer offline)
#   awaiting_approval - final video + caption sent to the owner; NOTHING is posted yet
#   approved          - owner approved that exact video + caption; posting in progress
#   posted            - live on the Facebook Page (post link in the run log)
#   rejected          - owner rejected it; not posted
#   failed            - see the run log in output/
#
# Optional per-topic overrides: length_seconds, narrator, look, language, notes
# Every story: Tagalog, Filipino folklore, dark foggy night, slow eerie male narrator, ends on a twist.

topics:
  - id: bote-diyaryo-alaala
    status: approved
    topic: "Kilabot #1: Bote, Diyaryo, at Alaala — a 3 AM junk buyer who pays cash for painful memories"
    folklore: "Original urban legend (magbobote / junk buyer at 3 AM)"
    source: "Kwento: Kilabot — Story #1 + Facebook Growth Kit (Oct 26, 2026)"
    clip_count: 23            # full ~2:20 story, owner-approved 2026-10-27
    max_clips: 26             # owner-approved credit cap for this video (includes a few redos)
    max_words_per_clip: 17
    length_seconds: 140
    notes: "Use the script from the growth kit nearly verbatim. Narrator = Flow character (low, tired, almost calm Tagalog male). Faint squeaky cart wheel under the video, distant 'Bote! Diyaryo!' call, silence before the twist, 1s pause after 'Sinong Papa, anak?'. On-screen last card: Kung kayo ang nasa lugar ko, ibebenta niyo ba? Caption A."

  - id: aswang-sa-kabilang-bahay
    status: draft             # change to "ready" to produce it
    topic: "Isang dalaga sa probinsya ang napapansing laging gising sa gabi ang bagong kapitbahay — aswang pala"
    folklore: "Aswang"
    notes: "Twist: ang tagapagsalaysay mismo ang aswang na nagbabantay sa dalaga."

  - id: tikbalang-sa-daan
    status: draft
    topic: "Isang binatang naliligaw sa maulap na daan pauwi, paikot-ikot sa iisang puno"
    folklore: "Tikbalang"
    notes: "Twist: nakauwi siya, pero ang sumalubong sa kanya sa bahay ay hindi niya tunay na ina."

  - id: kapre-sa-balete
    status: draft
    topic: "Mga batang naglalaro malapit sa lumang puno ng balete; amoy tabako tuwing hatinggabi"
    folklore: "Kapre"
    notes: "Twist: ang batang nawawala ay matagal nang patay — siya ang nag-aaya sa mga kalaro."

  - id: manananggal-sa-bubong
    status: draft
    topic: "Isang buntis na nakakarinig ng pagaspas ng pakpak sa bubong tuwing kabilugan ng buwan"
    folklore: "Manananggal"
    notes: "Walang dugo o gore. Twist: ang kalahating katawan sa kubo ay sa kumadronang nag-aalaga sa kanya."

  - id: tiyanak-sa-gubat

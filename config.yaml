# Defaults for every video. A topic in queue/topics.yaml can override video length, narrator, look, language and notes.
# Channel: Kwento: Kilabot — Tagalog horror stories based on Filipino folklore.

video:
  aspect_ratio: "9:16"          # vertical for Reels / TikTok / Shorts
  length_seconds: 54            # short stories: 45-60s, 5-7 clips of 6/8/10s (see PROMPT_GUIDE clip timing)
  clip_seconds: 9               # average clip length used to estimate clip count
  max_words_per_clip: 18        # hard cap for a 10s clip; 8s = 14, 6s = 9
  cta_in_last_clip: false       # last clip is the twist; the call to action goes in the caption instead

voice:
  language: "Tagalog"
  narrator: "low, tired, almost calm adult Filipino male voice, hushed Tagalog storytelling, never shouting"
  flow_character: "Narrator"   # Flow character with voice enceladus; attach to every narrated clip

style:
  look: "dark foggy night, thick low mist, cold blue moonlight, deep shadows, cinematic, realistic, slow ominous camera movement, subtle film grain"   # add the setting per story (province or Metro Manila)
  negatives: "no subtitles, no on-screen text, no watermark, no logos, no gore, no blood"

caption:
  # Final caption = caption_text (from prompts.json) + cta + hashtags (topic hashtags first, then these).
  cta: "I-follow ang Kwento: Kilabot para sa susunod na kwento ng lagim."
  hashtags: "#KwentoKilabot #PinoyHorror #TagalogHorror #FilipinoFolklore #Kababalaghan"
  max_chars: 2200

flow:
  url: "https://flow.google.com"
  model: "Omni 1.1 Flash"       # 720p, 9:16, Ingredients mode; 6s=10, 8s=12, 10s=15 credits
  outputs_per_prompt: 1         # variants per clip (each one costs credits)
  max_clips_per_run: 8          # per VIDEO (redos count too)
  min_videos_per_run: 1         # owner: at least 1 video every day (always made first)
  videos_per_run: 3             # up to 3 when credits allow
  credits_per_video_estimate: 90   # standard 45-60s story (6-7 clips)
  lean_video_max_credits: 50    # lean story (4-5 clips, ~35-45s) fits the +50 credits/day allowance
  extras_reserve: 300           # make videos 2-3 only if the balance stays above this afterwards
  lean_below: 300               # below this balance, video 1 is a lean story so the daily video never stops
  credit_reserve: 0             # absolute floor
  download_clips: true          # download finished clips to the computer's Downloads folder

delivery:
  width: 720
  height: 1280
  max_mb: 9.5                   # small files are easier to upload from a phone
  folder: "~/Downloads/Kwento Kilabot"

facebook:
  page_name: "Kwento: Kilabot"
  posting: "manual"             # owner posts approved videos themself (decided 2026-10-27 04:17); Claude never posts and needs no Facebook access

schedule:
  # Informational: the actual schedule is the Claude scheduled task "Kwento: Kilabot daily videos" (created 2026-10-27, runs on the owner's computer, auto-approved actions; never posts).
  description: "Daily 8:45 AM Asia/Manila: at least 1 video, up to 3 when credits allow; each sent for approval"
